    <!-- ก่อน paint: (1) ไปหน้าภาษาที่ผู้ชมเคยเลือก / ภาษาเครื่องเป็นไทย → /th/  (2) ตั้งธีม กันจอกะพริบ -->
    <script>
      try {
        var here = location.pathname.indexOf('/th') === 0 ? 'th' : 'en'
        var saved = localStorage.getItem('lang')
        var want = saved === 'th' || saved === 'en' ? saved : here === 'en' && /^th/i.test(navigator.language) ? 'th' : here
        if (want !== here) location.replace((want === 'th' ? '/th/' : '/') + location.search + location.hash)
      } catch (e) {}
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
