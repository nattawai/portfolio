    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Natthasak Wiwatwisawakorn — Senior Full-Stack Developer</title>
    <meta name="description" content="Full-Stack Developer focused on backend and AI integration — finance, risk control management and HR systems." />
    <meta property="og:title" content="Natthasak Wiwatwisawakorn — Senior Full-Stack Developer" />
    <meta property="og:description" content="Full-Stack Developer focused on backend and AI integration — finance, risk control management and HR systems." />

    <meta name="theme-color" content="#1c1a17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf6f1" media="(prefers-color-scheme: light)" />
    <!-- ตั้งธีมก่อน paint กันจอกะพริบ: ค่าที่ผู้ชมเลือกเอง > ค่าของเครื่อง -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- โหลดฟอนต์แบบไม่บล็อกการแสดงผล (Lighthouse: render-blocking) -->

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
